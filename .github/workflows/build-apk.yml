name: Build Android APK

# Builds the debug APK on every push / PR and uploads it as a downloadable artifact.
# google-services.json is NOT committed — it is decoded at build time from the
# GOOGLE_SERVICES_JSON repository secret (raw JSON; see README "CI" section).

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on ubuntu runners)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add it via repo Settings > Secrets and variables > Actions (paste the raw google-services.json content). Fork PRs do not receive secrets."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; d=json.load(open('android/app/google-services.json')); print('google-services.json OK, project_id =', d.get('project_id'))"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/build.log

      - name: Comment build error on the PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### :x: Build failed — last 120 lines of the Gradle log"
            echo '```'
            tail -n 120 /tmp/build.log
            echo '```'
          } | gh pr comment ${{ github.event.pull_request.number }} --body-file -

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosque-hisab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Optional: signed release APK. Requires 3 more secrets (see README):
