name: Build Android APK

# Builds the debug APK on every push / PR and uploads it as a downloadable artifact.
# google-services.json is NOT committed — it is written at build time from the
# GOOGLE_SERVICES_JSON repository secret (raw JSON; see README "CI" section).

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: android/functions/package-lock.json

      - name: Test server-side ledger
        working-directory: android/functions
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on ubuntu runners)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add it via repo Settings > Secrets and variables > Actions (paste the raw google-services.json content). Fork PRs do not receive secrets."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; d=json.load(open('android/app/google-services.json')); print('google-services.json OK, project_id =', d.get('project_id'))"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          if gradle --no-daemon --console=plain assembleDebug 2>&1 | tee /tmp/build.log; then
            echo "err=" >> "$GITHUB_OUTPUT"
          else
            # capture the first compile/config error lines so they surface in the
            # next step's name (readable via the Actions jobs API)
            ERR=$(grep -E -A4 '^e:|error:|FAILURE:|What went wrong' /tmp/build.log | head -n 30 | tr '\n' ' ' | head -c 700)
            echo "err=${ERR}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "BUILD RESULT — ${{ steps.build.outputs.err }}"
        if: always()
        run: |
          if [ -n "${{ steps.build.outputs.err }}" ]; then
            echo "${{ steps.build.outputs.err }}"
            exit 1
          fi

      - name: Comment build error on the PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/payload.json
          import json
          log = open('/tmp/build.log', errors='replace').read()[-8000:]
          body = "### :x: Build failed — Gradle log tail\n```\n" + log + "\n```"
          print(json.dumps({"body": body}))
          PY
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --input /tmp/payload.json || echo "PR comment failed (token may be read-only)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosque-hisab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

